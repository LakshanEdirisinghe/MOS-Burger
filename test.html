<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Card Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    :root {
      --dark-team-brown: #A64931;
      --light-team-brown: #DDAA82;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f6fa;
    }




    .custom-card {
      width: 199px;
      height: 165px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .custom-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .custom-card .card-body {
      padding: 0.5rem;
    }

    .custom-card .card-title {
      font-size: 1rem;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-card .card-text {
      font-size: 0.875rem;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .custom-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>

<div class="d-flex flex-wrap gap-4 justify-content-between">

  <div class="card custom-card mt-3 mb-3" style="flex: 1 1 18rem; max-width: 18rem;">
    <img src="/img/b4facf495c22df52f3ca635379ebe613 (1).jpeg" class="card-img-top img-fluid" alt="Item Image">
    <div class="card-body">
      <h5 class="card-title">Classic Burger</h5>
      <p class="card-text">A delicious burger with fresh ingredients.</p>
    </div>
  </div>

  <div class="card custom-card mt-3 mb-3" style="flex: 1 1 18rem; max-width: 18rem;">
    <img src="/img/b4facf495c22df52f3ca635379ebe613 (1).jpeg" class="card-img-top img-fluid" alt="Item Image">
    <div class="card-body">
      <h5 class="card-title">Classic Burger</h5>
      <p class="card-text">A delicious burger with fresh ingredients.</p>
    </div>
  </div>

  <!-- repeat other cards the same way -->
</div>


</body>

</html>
